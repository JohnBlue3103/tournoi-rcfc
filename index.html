<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Résultats du tournoi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-loading" style="text-align:center;padding:3rem;color:#666">Chargement…</div>

<div id="app" class="hidden">
  <header class="header">
    <h1 id="t-nom"></h1>
    <p id="t-infos"></p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('poules')">🏆 Classements</button>
    <button class="tab" onclick="switchTab('matchs')">⚽ Matchs</button>
  </div>

  <div id="tab-poules" class="tab-panel">
    <div id="classements-wrap"></div>
  </div>

  <div id="tab-matchs" class="tab-panel hidden">
    <div id="matchs-wrap"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/public.js"></script>
</body>
</html>
