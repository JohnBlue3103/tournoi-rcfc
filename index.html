<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournois RCFC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ACCUEIL -->
<div id="view-home" class="hidden">
  <header class="header">
    <h1>⚽ Tournois RCFC</h1>
    <p>Sélectionne un tournoi pour suivre les résultats</p>
  </header>
  <div id="home-loading" style="text-align:center;padding:3rem;color:#666">Chargement…</div>
  <div id="home-list" class="hidden home-list"></div>
</div>

<!-- TOURNOI -->
<div id="view-tournoi" class="hidden">
  <header class="header header-tournoi">
    <button class="btn-back" onclick="goHome()">← Retour</button>
    <div>
      <h1 id="t-nom"></h1>
      <p id="t-infos"></p>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-btn-agenda"     onclick="switchTab('agenda')">📅 Agenda</button>
    <button class="tab"        id="tab-btn-classement" onclick="switchTab('classement')">🏆 Classement</button>
    <button class="tab"        id="tab-btn-phases"     onclick="switchTab('phases')">🥇 Phases</button>
    <button class="tab"        id="tab-btn-terrains"   onclick="switchTab('terrains')">📍 Terrains</button>
  </div>

  <div id="tab-agenda"     class="tab-panel"></div>
  <div id="tab-classement" class="tab-panel hidden"></div>
  <div id="tab-phases"     class="tab-panel hidden"></div>
  <div id="tab-terrains" class="tab-panel hidden">
    <div class="terrains-plan">

      <div class="terrain-section">
        <div class="terrain-header terrain-h">
          <strong>TERRAIN HONNEUR</strong>
          <em>(terrain municipal)</em>
        </div>
        <svg class="terrain-svg" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
          <defs><clipPath id="clip-h"><rect x="3" y="3" width="794" height="254" rx="12"/></clipPath></defs>
          <rect width="800" height="260" rx="14" fill="#002b6b"/>
          <rect x="3" y="3" width="794" height="254" rx="12" fill="#2b8a38"/>
          <g clip-path="url(#clip-h)">
            <rect x="0"   y="0" width="50" height="260" fill="#33a047" opacity=".55"/>
            <rect x="100" y="0" width="50" height="260" fill="#33a047" opacity=".55"/>
            <rect x="200" y="0" width="50" height="260" fill="#33a047" opacity=".55"/>
            <rect x="300" y="0" width="50" height="260" fill="#33a047" opacity=".55"/>
            <rect x="400" y="0" width="50" height="260" fill="#33a047" opacity=".55"/>
            <rect x="500" y="0" width="50" height="260" fill="#33a047" opacity=".55"/>
            <rect x="600" y="0" width="50" height="260" fill="#33a047" opacity=".55"/>
            <rect x="700" y="0" width="50" height="260" fill="#33a047" opacity=".55"/>
          </g>
          <rect x="22" y="18" width="756" height="224" fill="none" stroke="white" stroke-width="2.5"/>
          <line x1="400" y1="18" x2="400" y2="242" stroke="white" stroke-width="2.5"/>
          <path d="M 22 28 A 10 10 0 0 0 32 18"   fill="none" stroke="white" stroke-width="2"/>
          <path d="M 768 18 A 10 10 0 0 1 778 28"  fill="none" stroke="white" stroke-width="2"/>
          <path d="M 22 232 A 10 10 0 0 1 32 242"  fill="none" stroke="white" stroke-width="2"/>
          <path d="M 768 242 A 10 10 0 0 0 778 232" fill="none" stroke="white" stroke-width="2"/>
          <!-- H1 -->
          <rect x="171" y="3"   width="80"  height="18" fill="rgba(255,255,255,.12)" stroke="white" stroke-width="1.5"/>
          <rect x="131" y="18"  width="160" height="56" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
          <circle cx="211" cy="87"  r="2.5" fill="white"/>
          <circle cx="211" cy="130" r="2.5" fill="white"/>
          <circle cx="211" cy="173" r="2.5" fill="white"/>
          <rect x="131" y="186" width="160" height="56" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
          <rect x="171" y="239" width="80"  height="18" fill="rgba(255,255,255,.12)" stroke="white" stroke-width="1.5"/>
          <!-- H2 -->
          <rect x="549" y="3"   width="80"  height="18" fill="rgba(255,255,255,.12)" stroke="white" stroke-width="1.5"/>
          <rect x="509" y="18"  width="160" height="56" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
          <circle cx="589" cy="87"  r="2.5" fill="white"/>
          <circle cx="589" cy="130" r="2.5" fill="white"/>
          <circle cx="589" cy="173" r="2.5" fill="white"/>
          <rect x="509" y="186" width="160" height="56" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
          <rect x="549" y="239" width="80"  height="18" fill="rgba(255,255,255,.12)" stroke="white" stroke-width="1.5"/>
          <!-- Labels -->
          <rect x="153" y="99" width="116" height="62" rx="8" fill="#002b6b" opacity=".7"/>
          <text x="211" y="141" text-anchor="middle" fill="white" font-size="34" font-weight="900" font-family="-apple-system,sans-serif">H1</text>
          <rect x="531" y="99" width="116" height="62" rx="8" fill="#002b6b" opacity=".7"/>
          <text x="589" y="141" text-anchor="middle" fill="white" font-size="34" font-weight="900" font-family="-apple-system,sans-serif">H2</text>
        </svg>
      </div>

      <div class="terrain-section">
        <div class="terrain-header terrain-k">
          <strong>TERRAIN KARBEN</strong>
          <em>(terrain à côté du collège)</em>
        </div>
        <svg class="terrain-svg" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
          <defs><clipPath id="clip-k"><rect x="3" y="3" width="794" height="254" rx="12"/></clipPath></defs>
          <rect width="800" height="260" rx="14" fill="#1a5e20"/>
          <rect x="3" y="3" width="794" height="254" rx="12" fill="#267830"/>
          <g clip-path="url(#clip-k)">
            <rect x="0"   y="0" width="50" height="260" fill="#2e8f3c" opacity=".55"/>
            <rect x="100" y="0" width="50" height="260" fill="#2e8f3c" opacity=".55"/>
            <rect x="200" y="0" width="50" height="260" fill="#2e8f3c" opacity=".55"/>
            <rect x="300" y="0" width="50" height="260" fill="#2e8f3c" opacity=".55"/>
            <rect x="400" y="0" width="50" height="260" fill="#2e8f3c" opacity=".55"/>
            <rect x="500" y="0" width="50" height="260" fill="#2e8f3c" opacity=".55"/>
            <rect x="600" y="0" width="50" height="260" fill="#2e8f3c" opacity=".55"/>
            <rect x="700" y="0" width="50" height="260" fill="#2e8f3c" opacity=".55"/>
          </g>
          <rect x="22" y="18" width="756" height="224" fill="none" stroke="white" stroke-width="2.5"/>
          <line x1="400" y1="18" x2="400" y2="242" stroke="white" stroke-width="2.5"/>
          <path d="M 22 28 A 10 10 0 0 0 32 18"   fill="none" stroke="white" stroke-width="2"/>
          <path d="M 768 18 A 10 10 0 0 1 778 28"  fill="none" stroke="white" stroke-width="2"/>
          <path d="M 22 232 A 10 10 0 0 1 32 242"  fill="none" stroke="white" stroke-width="2"/>
          <path d="M 768 242 A 10 10 0 0 0 778 232" fill="none" stroke="white" stroke-width="2"/>
          <!-- K1 -->
          <rect x="171" y="3"   width="80"  height="18" fill="rgba(255,255,255,.12)" stroke="white" stroke-width="1.5"/>
          <rect x="131" y="18"  width="160" height="56" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
          <circle cx="211" cy="87"  r="2.5" fill="white"/>
          <circle cx="211" cy="130" r="2.5" fill="white"/>
          <circle cx="211" cy="173" r="2.5" fill="white"/>
          <rect x="131" y="186" width="160" height="56" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
          <rect x="171" y="239" width="80"  height="18" fill="rgba(255,255,255,.12)" stroke="white" stroke-width="1.5"/>
          <!-- K2 -->
          <rect x="549" y="3"   width="80"  height="18" fill="rgba(255,255,255,.12)" stroke="white" stroke-width="1.5"/>
          <rect x="509" y="18"  width="160" height="56" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
          <circle cx="589" cy="87"  r="2.5" fill="white"/>
          <circle cx="589" cy="130" r="2.5" fill="white"/>
          <circle cx="589" cy="173" r="2.5" fill="white"/>
          <rect x="509" y="186" width="160" height="56" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/>
          <rect x="549" y="239" width="80"  height="18" fill="rgba(255,255,255,.12)" stroke="white" stroke-width="1.5"/>
          <!-- Labels -->
          <rect x="153" y="99" width="116" height="62" rx="8" fill="#1a5e20" opacity=".7"/>
          <text x="211" y="141" text-anchor="middle" fill="white" font-size="34" font-weight="900" font-family="-apple-system,sans-serif">K1</text>
          <rect x="531" y="99" width="116" height="62" rx="8" fill="#1a5e20" opacity=".7"/>
          <text x="589" y="141" text-anchor="middle" fill="white" font-size="34" font-weight="900" font-family="-apple-system,sans-serif">K2</text>
        </svg>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/public.js"></script>
</body>
</html>
